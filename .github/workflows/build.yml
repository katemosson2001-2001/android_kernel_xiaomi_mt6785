name: Test magiskboot repack

on:
  workflow_dispatch:

jobs:
  build:
    name: Test repack
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

      - name: Download original boot.img from LOS 23.2
        run: |
          wget -O boot_original.img \
            https://mirrors.dotsrc.org/lineageos/full/rosemary/20260311/boot.img

      - name: Get magiskboot
        run: |
          wget -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v28.0/Magisk-v28.0.apk
          unzip Magisk.apk lib/x86_64/libmagiskboot.so
          mv lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Repack boot.img without changes
        run: |
          mkdir boot_work
          cd boot_work
          ../magiskboot unpack ../boot_original.img
          ../magiskboot repack ../boot_original.img
          mv new-boot.img ../boot_new.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-rosemary
          path: boot_new.img
