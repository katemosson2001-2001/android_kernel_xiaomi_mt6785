name: Build Kernel rosemary

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ─── Установка необходимых программ ───
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex \
            libssl-dev libelf-dev python3 lz4 zstd wget unzip \
            device-tree-compiler

      # ─── Скачивание исходников ядра ───
      - name: Clone kernel source
        run: |
          git clone -b lineage-23.2 \
            https://github.com/katemosson2001-2001/android_kernel_xiaomi_mt6785 \
            kernel
          cd kernel
          echo "=== HEAD коммит ==="
          git log --oneline -1

          echo "=== Ищем коммит gb74ec728658f ==="
          git log --all --oneline | grep "gb74ec728658f" || echo "Не найден в shallow clone"

          # Пробуем переключиться на нужный коммит
          git checkout gb74ec728658f 2>/dev/null && echo "Переключено на gb74ec728658f" || {
            echo "Коммит не найден в shallow clone, скачиваем полную историю..."
            git fetch --unshallow
            git checkout gb74ec728658f && echo "Переключено на gb74ec728658f" || echo "КОММИТ НЕ НАЙДЕН В РЕПОЗИТОРИИ"
          }

          echo ""
          echo "=== Текущий коммит ==="
          git log --oneline -1
          echo ""
          echo "=== EXTRAVERSION в Makefile ==="
          head -5 Makefile
          grep "EXTRAVERSION" Makefile | head -3

      # ─── Кэширование тулчейнов (ускоряет повторные сборки) ───
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            toolchain/clang
            toolchain/gcc64
            toolchain/gcc32
          key: toolchains-v2

      # ─── Скачивание компиляторов ───
      - name: Download Clang toolchain
        run: |
          if [ ! -d toolchain/clang ]; then
            mkdir -p toolchain
            echo "=== Скачиваем Android NDK r29 (содержит clang-r563880c) ==="
            wget -q --show-progress -O ndk.zip \
              "https://dl.google.com/android/repository/android-ndk-r29-linux.zip"
            unzip -q ndk.zip "android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/*" -d /tmp/
            mv /tmp/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64 toolchain/clang
            rm -rf ndk.zip /tmp/android-ndk-r29
          fi
          echo "=== Версия Clang ==="
          toolchain/clang/bin/clang --version | head -2
          
      - name: Download GCC toolchain
        run: |
          if [ ! -d toolchain/gcc64 ]; then
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
              toolchain/gcc64
          fi
          if [ ! -d toolchain/gcc32 ]; then
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
              toolchain/gcc32
          fi

      # ─── Скачивание оригинального boot.img ───
      - name: Download original boot.img
        run: |
          wget -q --show-progress -O boot_original.img \
            https://mirrors.dotsrc.org/lineageos/full/rosemary/20260402/boot.img
          echo "Размер: $(stat -c%s boot_original.img) байт"

      # ─── Скачивание magiskboot ───
      - name: Get magiskboot
        run: |
          wget -q -O Magisk.apk \
            https://github.com/topjohnwu/Magisk/releases/download/v28.0/Magisk-v28.0.apk
          unzip -q Magisk.apk lib/x86_64/libmagiskboot.so
          mv lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Extract original kernel config
        run: |
          cd boot_work 2>/dev/null || {
            mkdir boot_work && cd boot_work
            ../magiskboot unpack ../boot_original.img
          }
          cd ../kernel

          echo "=== Извлекаем конфиг из оригинального ядра ==="
          scripts/extract-ikconfig ../boot_work/kernel > ../original_config 2>/dev/null && {
            echo "Конфиг извлечён! Строк: $(wc -l < ../original_config)"
            echo ""
            echo "=== DEBUG_INFO в оригинале ==="
            grep "CONFIG_DEBUG_INFO" ../original_config
            echo ""
            echo "=== Количество =y опций ==="
            echo -n "Оригинал: "
            grep -c "=y" ../original_config
            echo ""
            echo "=== Копируем как defconfig ==="
            cp ../original_config arch/arm64/configs/extracted_defconfig
          } || echo "ОШИБКА: CONFIG_IKCONFIG не включен в оригинале"

      - name: Check build configs
        run: |
          cd kernel
          echo "=== build.config файлы ==="
          ls -la build.config* 2>/dev/null

          echo ""
          echo "=== build.config.mtk.aarch64 ==="
          cat build.config.mtk.aarch64 2>/dev/null || echo "Не найден"

          echo ""
          echo "=== build.config.mtk.aarch64.gcc ==="
          cat build.config.mtk.aarch64.gcc 2>/dev/null || echo "Не найден"

          echo ""
          echo "=== build.config.mtk.aarch64.tiramisu ==="
          cat build.config.mtk.aarch64.tiramisu 2>/dev/null || echo "Не найден"

          echo ""
          echo "=== Все build.config* файлы ==="
          for f in build.config*; do
            echo "--- $f ---"
            cat "$f" 2>/dev/null
            echo ""
          done

      # ─── Подготовка конфигурации ядра ───
      - name: Configure kernel
        run: |
          export PATH="$(pwd)/toolchain/clang/bin:$(pwd)/toolchain/gcc64/bin:$(pwd)/toolchain/gcc32/bin:$PATH"
          cd kernel
          git checkout -- .

          echo ">>> Используем конфиг из оригинального ядра"
          make O=out ARCH=arm64 extracted_defconfig

          # RTL8152/8153/8156 (Realtek)
          scripts/config --file out/.config -e CONFIG_USB_RTL8152
          # ASIX AX88179/AX88178A
          scripts/config --file out/.config -e CONFIG_USB_NET_AX88179_178A
          # ASIX AX88772/AX88178
          scripts/config --file out/.config -e CONFIG_USB_NET_AX8817X
          # CDC Ethernet
          scripts/config --file out/.config -e CONFIG_USB_NET_CDCETHER
          # CDC NCM
          scripts/config --file out/.config -e CONFIG_USB_NET_CDC_NCM
          # RNDIS host
          scripts/config --file out/.config -e CONFIG_USB_NET_RNDIS_HOST
          # Зависимости
          scripts/config --file out/.config -e CONFIG_USB_NET_DRIVERS
          scripts/config --file out/.config -e CONFIG_USB_USBNET
          scripts/config --file out/.config -e CONFIG_MII

          make O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== Проверка USB Ethernet ==="
          grep -E "RTL8152|AX88179|AX8817X|CDCETHER|CDC_NCM|RNDIS_HOST|USB_USBNET" out/.config

      # ─── Проверка конфигурации ───
      - name: Verify config
        run: |
          cd kernel
          echo "=== Проверка ключевых опций ==="
          echo -n "RTL8152: "
          grep -c "CONFIG_USB_RTL8152=y" out/.config && echo "OK" || echo "ОШИБКА!"
          echo -n "APPENDED_DTB: "
          grep "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE" out/.config || echo "Отключена (OK)"
          echo -n "LOCALVERSION: "
          grep "CONFIG_LOCALVERSION=" out/.config

      # ─── Сборка ядра ───
      - name: Build kernel
        run: |
          export PATH="$(pwd)/toolchain/clang/bin:$(pwd)/toolchain/gcc64/bin:$(pwd)/toolchain/gcc32/bin:$PATH"
          cd kernel
          make O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="" \
            -j$(nproc) 2>&1 | tail -30
            
      # ─── Проверка результатов сборки ───
      - name: Verify build outputs
        run: |
          cd kernel
          echo "=== Собранный Image ==="
          ls -lh out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image

          echo ""
          echo "=== Версия ядра в бинарнике ==="
          strings out/arch/arm64/boot/Image | grep "Linux version" | head -1

          echo ""
          echo "=== DTB файлы ==="
          find out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | head -20
          find out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | wc -l
          echo "DTB файлов найдено"

      # ─── Распаковка и пересборка boot.img ───
      - name: Repack boot.img
        run: |
          rm -rf boot_work
          mkdir boot_work && cd boot_work
          ../magiskboot unpack ../boot_original.img

          echo "Оригинальный kernel: $(stat -c%s kernel) байт"
          cp ../kernel/out/arch/arm64/boot/Image kernel
          echo "Новый kernel: $(stat -c%s kernel) байт"

          echo "Оригинальный dtb: $(stat -c%s dtb) байт"
          cp ../kernel/out/arch/arm64/boot/dts/mediatek/mt6785.dtb dtb
          echo "Новый dtb: $(stat -c%s dtb) байт"

          ../magiskboot repack ../boot_original.img
          mv new-boot.img ../boot_new.img
      
      # ─── Финальная проверка ───
      - name: Verify final boot.img
        run: |
          mkdir -p verify && cd verify
          ../magiskboot unpack ../boot_new.img
          echo "=== Содержимое финального boot.img ==="
          ls -lh
          echo ""
          echo "=== Версия ядра ==="
          strings kernel | grep "Linux version" | head -1

      # ─── Загрузка результата ───
      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-rosemary
          path: boot_new.img
