name: Build Kernel rosemary

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/katemosson2001-2001/android_kernel_xiaomi_mt6785
          kernel-branch: lineage-23.2
          config: rosemary_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 14
          aosp-clang-version: r383902
          bootimg-url: https://mirrors.dotsrc.org/lineageos/full/rosemary/20260311/boot.img
